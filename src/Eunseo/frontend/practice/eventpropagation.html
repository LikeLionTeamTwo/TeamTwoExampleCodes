<!-- 이벤트 버블링  -->
<!-- 이벤트 전파  -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <style>
      * {
        border: 3px solid black;
      }
    </style>
  </head>
  <body>
    <!-- 큰 투명한 상자 (가장 바깥 상자) -->
    <!-- 공이 클릭되면 이 outer-div부터 이벤트 전파 시작 -->
    <div onclick="alert('outer-div');">
      <!-- 제일 바깥쪽 상자 outer-div 안에 들어 있는 중간 크기 상자 inner-div-->
      <!-- 공은 outer-div → inner-div로 내려감 (캡처링) -->
      <div onclick="alert('inner-div');">
        <!-- inner-inner_div 안에 있는 작은 제목 상자 -->
        <!-- 공은 가장 안쪽으로 계속 굴러감 -->
        <div onclick="alert('inner-inner_div');">
          <!-- 제목 상자 안에 있는 가장 작은 상자 (p태그) -->
          <!-- p태그 클릭 시, 공이 p에서 멈추고 이벤트 실행 (타겟 단계) -->
          <h1 onclick="alert('h1');">
            <p onclick="alert('p');">p태그</p>
          </h1>
        </div>
      </div>
    </div>
  </body>
</html>

<!-- DOM 구조는 투명한 상자들이 중첩된 형태:

    부모 요소는 큰 투명한 상자.
    자식 요소는 부모 상자 안에 들어 있는 작은 상자.
    상자 안의 상자가 계속 중첩되어 있는 구조. -->

<!-- 캡처링 단계:

  가장 바깥 상자(부모 상자)에서 이벤트가 시작해 안쪽 상자(자식 상자)로 내려감.
  비유: 큰 상자에서 작은 상자로 공이 굴러 들어간다. -->

<!-- 타겟 단계:

  공이 가장 안쪽 상자에 도달했을 때 이벤트가 발생.
  비유: 공이 멈추고, 목표 지점에서 무언가 실행됨. -->

<!-- 버블링 단계:

  공이 다시 안쪽 상자에서 시작해 바깥 상자로 굴러 나옴.
  비유: 작은 상자에서 큰 상자로 공이 튀어나온다. -->
